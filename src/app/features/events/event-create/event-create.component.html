<div class="create-wrapper">

  <div class="create-header">
    <button class="btn-back" (click)="cancel()">← Retour</button>
    <h1>Créer un événement</h1>
  </div>

  <div class="create-form">

    <!-- Titre -->
    <div class="form-group">
      <label>Titre *</label>
      <input type="text"
             [(ngModel)]="formEvent.title"
             placeholder="Titre de l'événement"
             [class.input-error]="errors.title"/>
      <span class="error-msg" *ngIf="errors.title">{{ errors.title }}</span>
    </div>

    <!-- Nom -->
    <div class="form-group">
      <label>Nom <span class="hint">(max 30 caractères)</span></label>
      <input type="text"
             [(ngModel)]="formEvent.name"
             placeholder="Nom court"
             maxlength="30"
             [class.input-error]="errors.name"/>
      <div class="input-footer">
        <span class="error-msg" *ngIf="errors.name">{{ errors.name }}</span>
        <span class="char-count" [class.near-limit]="formEvent.name.length >= 25">
          {{ formEvent.name.length }}/30
        </span>
      </div>
    </div>

    <!-- Date & Heure -->
    <div class="form-row">
      <div class="form-group">
        <label>Date *</label>
        <input type="date"
               [(ngModel)]="formEvent.date"
               [min]="todayDate"
               [class.input-error]="errors.date"/>
        <span class="error-msg" *ngIf="errors.date">{{ errors.date }}</span>
      </div>
      <div class="form-group">
        <label>Heure *</label>
        <input type="time"
               [(ngModel)]="formEvent.time"
               [class.input-error]="errors.time"/>
        <span class="error-msg" *ngIf="errors.time">{{ errors.time }}</span>
      </div>
    </div>

    <!-- Lieu -->
    <div class="form-group">
      <label>Lieu *</label>
      <input type="text"
             [(ngModel)]="formEvent.location"
             placeholder="Ville, adresse..."
             [class.input-error]="errors.location"/>
      <span class="error-msg" *ngIf="errors.location">{{ errors.location }}</span>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label>Description * <span class="hint">(min 20 caractères)</span></label>
      <textarea [(ngModel)]="formEvent.description"
                rows="4"
                placeholder="Décrivez l'événement..."
                [class.input-error]="errors.description">
      </textarea>
      <div class="input-footer">
        <span class="error-msg" *ngIf="errors.description">{{ errors.description }}</span>
        <span class="char-count" [class.valid]="formEvent.description.length >= 20">
          {{ formEvent.description.length }} / min 20
        </span>
      </div>
    </div>

    <!-- Max participants -->
    <div class="form-group">
      <label>Max participants *</label>
      <input type="number"
             [(ngModel)]="formEvent.maxParticipants"
             min="1"
             [class.input-error]="errors.maxParticipants"/>
      <span class="error-msg" *ngIf="errors.maxParticipants">
        {{ errors.maxParticipants }}
      </span>
    </div>

    <div class="form-actions">
      <button class="btn-cancel" (click)="cancel()">Annuler</button>
      <button class="btn-save" (click)="saveEvent()">
        Créer l'événement
      </button>
    </div>

  </div>

</div>
