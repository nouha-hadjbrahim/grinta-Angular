<div class="fail-wrapper">
  <div class="fail-card">
    <div class="fail-icon">❌</div>
    <h1>Paiement <span>Échoué</span></h1>
    <p>Votre paiement n'a pas pu être traité.</p>
    <p style="color:#aaa; font-size:13px">Votre réservation a été annulée.</p>
    <button class="retry-btn" (click)="retry()">🔄 Réessayer</button>
  </div>
</div>
