<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-left">
      <!-- Spacer for sidebar -->
    </div>
    <div class="navbar-center"></div>
    <div class="navbar-right">
      <!-- Notification Icon -->
      <div class="navbar-icon">
        <i class="bi bi-bell"></i>
        <span class="notification-badge">3</span>
      </div>

      <!-- Profile Dropdown -->   
      <div class="profile-container">
        <div class="profile-trigger" (click)="toggleDropdown()">
          <img *ngIf="userPhoto" [src]="userPhoto" alt="User Avatar" class="avatar-img" />
          <div *ngIf="!userPhoto" class="avatar">{{ adminAvatar }}</div>
          <div class="profile-info">
            <span class="profile-name">{{ adminName }}</span>
          </div>
          <i class="bi bi-chevron-down dropdown-chevron"></i>
        </div>

        <!-- Dropdown Menu -->
        <div class="profile-dropdown" *ngIf="showDropdown">
          <div class="dropdown-user-info">
            <img *ngIf="userPhoto" [src]="userPhoto" alt="User Avatar" class="dropdown-avatar-img" />
            <div *ngIf="!userPhoto" class="dropdown-avatar">{{ adminAvatar }}</div>
            <div>
              <p class="dropdown-email">{{ adminEmail }}</p>
            </div>
          </div>
          <hr class="dropdown-divider" />
          <a class="dropdown-item" (click)="navigateToProfile()">
            <i class="bi bi-person"></i>
            My Profile
          </a>
          <hr class="dropdown-divider" />
          <a class="dropdown-item logout" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i>
            Logout
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Profile Edit Modal -->
<app-update-user
  [isOpen]="showProfileModal"
  [user]="currentUser"
  (close)="closeProfileModal()"
  (userUpdated)="onProfileUpdated()"
></app-update-user>
