<div *ngIf="isOpen" class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <!-- Close Button -->
    <button class="close-btn" (click)="closeModal()">✕</button>

    <!-- Header -->
    <div class="modal-header">
      <div class="user-info">
        <h2 class="user-name">Create New Challenge</h2>
        <p class="user-email">Engage your community with a new challenge</p>
      </div>
    </div>

    <!-- Form -->
    <form [formGroup]="challengeForm" class="form-container" (ngSubmit)="onSubmit()">
      
      <!-- Title -->
      <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" formControlName="title" placeholder="e.g. 10k Run Challenge" class="form-input" />
        <div *ngIf="challengeForm.get('title')?.invalid && challengeForm.get('title')?.touched" class="error-text">
          Title is required.
        </div>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea formControlName="description" rows="4" placeholder="Describe the challenge..." class="form-input" style="min-height: 80px; resize: vertical;"></textarea>
        <div *ngIf="challengeForm.get('description')?.invalid && challengeForm.get('description')?.touched" class="error-text">
          Description is required.
        </div>
      </div>

      <div style="display: flex; gap: 20px; margin-bottom: 24px;">
        <!-- Type Dropdown -->
        <div class="form-group" style="flex: 1; margin-bottom: 0;">
          <label class="form-label">Challenge Type</label>
          <select formControlName="type" class="form-input form-select">
            <option value="FITNESS">Fitness</option>
            <option value="RUNNING">Running</option>
            <option value="NUTRITION">Nutrition</option>
          </select>
        </div>

        <!-- Target Value -->
        <div class="form-group" style="flex: 1; margin-bottom: 0;">
          <label class="form-label">Target Value</label>
          <input type="number" formControlName="targetValue" placeholder="e.g. 1000" class="form-input" />
        </div>
      </div>

      <div style="display: flex; gap: 20px; margin-bottom: 24px;">
        <!-- End Date -->
        <div class="form-group" style="flex: 1; margin-bottom: 0;">
          <label class="form-label">End Date</label>
          <input type="date" formControlName="endDate" class="form-input" />
          <div *ngIf="challengeForm.get('endDate')?.invalid && challengeForm.get('endDate')?.touched" class="error-text">
            End Date is required.
          </div>
        </div>

        <!-- Reward -->
        <div class="form-group" style="flex: 1; margin-bottom: 0;">
          <label class="form-label">Reward / Badge</label>
          <input type="text" formControlName="reward" placeholder="e.g. Gold Badge" class="form-input" />
        </div>
      </div>

      <!-- Trending Checkbox -->
      <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
        <input type="checkbox" formControlName="isTrending" id="trendingCheck" style="width: 18px; height: 18px; cursor: pointer;" />
        <label for="trendingCheck" style="margin: 0; cursor: pointer; color: #333; font-size: 14px; font-weight: 500;">Mark as Trending</label>
      </div>

      <!-- Error Message -->
      <div *ngIf="error" class="error-message">
        ✗ {{ error }}
      </div>

      <!-- Action Buttons -->
      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="closeModal()">
          Cancel
        </button>
        <button type="submit" class="btn-save" [disabled]="challengeForm.invalid || isSubmitting">
          <span *ngIf="isSubmitting" class="spinner-small"></span>
          {{ isSubmitting ? 'Creating...' : 'Create Challenge' }}
        </button>
      </div>
    </form>
  </div>
</div>
