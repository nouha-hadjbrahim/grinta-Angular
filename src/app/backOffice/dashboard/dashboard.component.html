<div class="dashboard-container">
  <h1 class="page-title">Dashboard Overview</h1>
  <p class="page-subtitle">Welcome back! Here's what's happening with GRINTA today.</p>

  <!-- Stats Cards -->
  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats" [style.border-left-color]="stat.color">
      <div class="stat-header">
        <div class="stat-icon" [style.background-color]="stat.color + '20'">
          <i [class]="'bi ' + stat.icon" [style.color]="stat.color"></i>
        </div>
        <div class="stat-change" [class.positive]="stat.change >= 0">
          <i class="bi bi-arrow-up"></i>
          {{ stat.change }}%
        </div>
      </div>
      <div class="stat-content">
        <h3 class="stat-label">{{ stat.label }}</h3>
        <p class="stat-value">{{ stat.value | number }}</p>
      </div>
    </div>
  </div>

  <!-- Charts Section -->
  <div class="charts-grid">
    <!-- Weekly Activity Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <h2>Weekly Workout Activity</h2>
      </div>
      <div class="chart-body">
        <div class="simple-chart">
          <div class="chart-bar" *ngFor="let data of weeklyData" [title]="data.day + ': ' + data.count">
            <div class="bar" [style.height.%]="(data.count / 100) * 100"></div>
            <span class="label">{{ data.day }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Monthly Revenue Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <h2>Monthly Revenue</h2>
      </div>
      <div class="chart-body">
        <div class="simple-chart revenue-chart">
          <div class="chart-bar" *ngFor="let data of monthlyData" [title]="data.month + ': $' + data.revenue">
            <div class="bar revenue" [style.height.%]="(data.revenue / 10000) * 100"></div>
            <span class="label">{{ data.month }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
