<div class="table-container">
  <div class="table-header">
    <div class="table-title-section">
      <h2 class="table-title">{{ title }}</h2>
    </div>
    <div class="table-controls">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input 
          type="text" 
          placeholder="Search..." 
          [(ngModel)]="searchTerm"
          (input)="onSearch(searchTerm)"
          class="search-input"
        />
      </div>
      <button 
        *ngIf="showAddButton"
        class="btn-add"
        (click)="onAddNew()">
        <i class="bi bi-plus"></i>
        Add New
      </button>
    </div>
  </div>

  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th *ngFor="let column of columns" 
              [class.sortable]="column.sortable"
              (click)="column.sortable && onSort(column.key)">
            <div class="header-content">
              <span>{{ column.label }}</span>
              <i *ngIf="column.sortable" [class]="'bi ' + getSortIcon(column.key)"></i>
            </div>
          </th>
          <th *ngIf="actions.length > 0" class="actions-column">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of filteredData; let i = index" [attr.data-index]="i">
          <td *ngFor="let column of columns" class="cell">
            <span>{{ item[column.key] }}</span>
          </td>
          <td *ngIf="actions.length > 0" class="actions-cell">
            <div class="action-buttons">
              <button 
                *ngFor="let action of actions"
                class="action-btn"
                [class]="'action-' + action.action"
                [title]="action.label"
                (click)="onAction(action.action, item)">
                <i [class]="'bi ' + action.icon"></i>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="filteredData.length === 0" class="empty-state">
          <td [attr.colspan]="columns.length + (actions.length > 0 ? 1 : 0)" class="empty-message">
            <i class="bi bi-inbox"></i>
            <p>No data found</p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="table-footer">
    <p class="record-count">Showing {{ filteredData.length }} of {{ data.length }} records</p>
  </div>
</div>
