<div class="signin-page d-flex flex-column align-items-center justify-content-center min-vh-100">

  <!-- Logo & Title -->
  <div class="d-flex align-items-center mb-2 gap-2">
    <img src="assets/logo.png" alt="logo" width="40" onerror="this.style.display='none'" />
    <span class="brand-name">GRINTA</span>
  </div>

  <h2 class="text-white fw-bold mb-1">Welcome Back</h2>
  <p class="text-muted mb-4">Log in to continue your fitness journey</p>

  <!-- Card -->
  <div class="signin-card p-4">

    <!-- Social Buttons -->
    <button class="btn social-btn w-100 mb-3">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" class="me-2" alt="google"/>
      Continue with Google
    </button>
    <button class="btn social-btn w-100 mb-3">
      <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" width="20" class="me-2" alt="facebook"/>
      Continue with Facebook
    </button>

    <div class="divider text-muted mb-3">Or continue with email</div>

    <!-- Email -->
    <label class="text-white mb-1">Email Address</label>
    <div class="input-group mb-3">
      <span class="input-icon"><i class="bi bi-envelope"></i></span>
      <input type="email" class="form-control custom-input" placeholder="your.email@example.com" [(ngModel)]="email" name="email" />
    </div>

    <!-- Password -->
    <label class="text-white mb-1">Password</label>
    <div class="input-group mb-3">
      <span class="input-icon"><i class="bi bi-lock"></i></span>
      <input type="password" class="form-control custom-input" placeholder="Enter your password" [(ngModel)]="password" name="password" />
    </div>

    <!-- Remember me & Forgot -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="remember" />
        <label class="form-check-label text-white" for="remember">Remember me</label>
      </div>
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert alert-danger py-2 mb-3">{{ errorMessage }}</div>

    <!-- Submit -->
    <button class="btn btn-login w-100" (click)="signIn()">Log In &rarr;</button>

  </div>
</div>
